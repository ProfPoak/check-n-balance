# Render Blueprint: the Flask API and its Postgres database.
# Render → New → Blueprint → pick this repo. The client is deployed separately on Netlify.
databases:
  - name: check-n-balance-db
    plan: free
    databaseName: check_n_balance

services:
  - type: web
    name: check-n-balance-api
    runtime: python
    plan: free
    buildCommand: pip install pipenv && pipenv install --system --deploy
    # Migrations run at start: free instances have no pre-deploy step or shell
    startCommand: cd server && flask db upgrade && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: FLASK_APP
        value: app.py
      - key: DATABASE_URL
        fromDatabase:
          name: check-n-balance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
